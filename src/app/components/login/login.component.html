<div class="login-container jazz-theme">
  <div class="login-card">
    <h1 class="text-center mb-4">{{ 'LOGIN.TITLE' | translate }}</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="username" class="form-label">{{ 'LOGIN.USERNAME' | translate }}</label>
        <input
          type="text"
          class="form-control jazz-input"
          id="username"
          formControlName="username"
          [placeholder]="'LOGIN.USERNAME' | translate">
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
             class="text-danger small mt-1">
          Username is required
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">{{ 'LOGIN.PASSWORD' | translate }}</label>
        <input
          type="password"
          class="form-control jazz-input"
          id="password"
          formControlName="password"
          [placeholder]="'LOGIN.PASSWORD' | translate">
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
             class="text-danger small mt-1">
          Password is required
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger mb-3">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100"
        [disabled]="!loginForm.valid">
        {{ 'LOGIN.SUBMIT' | translate }}
      </button>
    </form>
  </div>
</div>
